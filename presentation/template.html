<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Brief | Project Reporting Builder</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9eaec;
        color: #20232a;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        position: relative;
        margin: 24px auto;
      }
      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 675px;
        padding: 54px 64px;
        background: #fcfcfa;
        transform: scale(var(--scale, 1));
        transform-origin: top left;
        overflow: hidden;
        box-shadow: 0 14px 50px #20232a12;
      }
      .slide[hidden] {
        display: none;
      }
      .eyebrow {
        margin: 0 0 16px;
        font-size: 18px;
        color: #075dc0;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      h1 {
        font-size: 43px;
        line-height: 1.13;
        letter-spacing: -1.4px;
        margin: 0;
        max-width: 1060px;
      }
      h2 {
        font-size: 26px;
        line-height: 1.24;
        margin: 0 0 18px;
        letter-spacing: -0.5px;
      }
      p {
        line-height: 1.45;
      }
      .content {
        margin-top: 42px;
      }
      .points {
        display: grid;
        gap: 28px;
      }
      .point {
        position: relative;
      }
      .point p {
        font-size: 22px;
        margin: 10px 0;
        color: #4e5661;
      }
      .number {
        display: block;
        color: #075dc0;
        font-size: 17px;
        margin-bottom: 16px;
      }
      .takeaway {
        position: absolute;
        bottom: 64px;
        left: 64px;
        right: 64px;
        font-size: 23px;
        line-height: 1.3;
        font-weight: 600;
        padding-top: 20px;
        border-top: 1px solid #cdd3db;
        margin: 0;
      }
      .caption {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 43px;
        font-size: 14px;
        color: #555d69;
        margin: 0;
      }
      footer {
        position: absolute;
        bottom: 24px;
        left: 64px;
        right: 64px;
        display: flex;
        justify-content: space-between;
        color: #5c6470;
        font-size: 13px;
      }
      .cover {
        background: #102c52;
        color: #fff;
      }
      .cover .eyebrow {
        color: #b9d8ff;
      }
      .cover h1 {
        font-size: 112px;
        letter-spacing: -5px;
        margin-top: 44px;
      }
      .cover .content {
        margin-top: 24px;
      }
      .cover .points {
        gap: 14px;
      }
      .cover h2 {
        font-size: 23px;
        font-weight: 400;
        margin: 0;
        color: #dae8fa;
      }
      .cover .number {
        display: none;
      }
      .cover .takeaway {
        bottom: 107px;
        border: 0;
        padding: 0;
        font-size: 37px;
        max-width: 730px;
        font-weight: 500;
      }
      .cover footer {
        color: #b9d8ff;
      }
      .problem .points {
        gap: 0;
      }
      .problem .point {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #dce0e6;
        padding: 18px 0;
      }
      .problem .number {
        width: 70px;
        margin: 0;
      }
      .problem h2 {
        font-weight: 400;
        margin: 0;
        font-size: 27px;
      }
      .flow .points {
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        margin-top: 30px;
      }
      .flow .point {
        border-top: 3px solid #075dc0;
        padding-top: 22px;
      }
      .flow h2 {
        font-size: 30px;
      }
      .flow .point p {
        font-size: 24px;
      }
      .compare .points,
      .closing .points {
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
      }
      .compare h2,
      .closing h2 {
        font-size: 25px;
      }
      .compare .point p {
        font-size: 21px;
        margin: 16px 0;
      }
      .compare .point,
      .closing .point {
        border-top: 2px solid #c9d4e0;
        padding-top: 16px;
      }
      .screen .content {
        display: flex;
        gap: 32px;
        margin-top: 30px;
      }
      .screen-copy {
        width: 360px;
        padding-top: 12px;
      }
      .screen .points {
        gap: 23px;
      }
      .screen h2 {
        font-size: 25px;
        font-weight: 400;
        margin: 0;
      }
      .screen .number {
        display: none;
      }
      .screen figure {
        margin: 0;
        width: 676px;
        height: 425px;
        position: relative;
      }
      .screen img {
        width: 100%;
        height: 400px;
        object-fit: cover;
        object-position: top;
        border: 1px solid #d9dce1;
        border-radius: 6px;
      }
      .screen figcaption {
        font-size: 13px;
        color: #555d69;
        padding-top: 10px;
      }
      .screen .takeaway {
        display: none;
      }
      .demo .points {
        gap: 22px;
      }
      .demo .number {
        display: none;
      }
      .demo h2 {
        font-size: 26px;
        font-weight: 400;
        margin: 0;
      }
      .demo .takeaway {
        font-size: 21px;
      }
      .architecture .points {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 48px;
      }
      .architecture .point {
        border-left: 3px solid #075dc0;
        padding-left: 22px;
      }
      .architecture .number {
        display: none;
      }
      .architecture h2 {
        font-size: 25px;
        margin-bottom: 12px;
      }
      .architecture p {
        font-size: 21px;
      }
      .recovery .points {
        gap: 22px;
      }
      .recovery .point {
        display: flex;
        align-items: center;
      }
      .recovery .number {
        min-width: 54px;
        margin: 0;
      }
      .recovery h2 {
        font-size: 25px;
        font-weight: 400;
        margin: 0;
      }
      .numbers .points {
        grid-template-columns: repeat(3, 1fr);
        gap: 40px;
        margin-top: 55px;
      }
      .numbers h2 {
        font-size: 88px;
        letter-spacing: -4px;
        color: #075dc0;
        margin-bottom: 12px;
      }
      .numbers .number {
        display: none;
      }
      .numbers p {
        font-size: 24px;
      }
      .numbers .caption {
        font-size: 14px;
      }
      .numbers .takeaway {
        bottom: 93px;
      }
      .cloud .points {
        grid-template-columns: repeat(2, 1fr);
        gap: 66px;
      }
      .cloud .point {
        border-top: 3px solid #075dc0;
        padding-top: 20px;
      }
      .cloud .point p {
        margin: 16px 0;
      }
      .cloud h2 {
        font-size: 28px;
      }
      .cloud .number {
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 22px;
      }
      th {
        text-align: left;
        color: #075dc0;
        font-size: 18px;
        border-bottom: 2px solid #91a6c0;
        padding: 0 16px 16px 0;
      }
      td {
        padding: 20px 20px 20px 0;
        border-bottom: 1px solid #dce0e6;
        font-size: 21px;
        line-height: 1.28;
      }
      td:first-child {
        width: 29%;
      }
      td:nth-child(2) {
        width: 32%;
      }
      nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 0 20px 20px;
      }
      button {
        font: inherit;
        font-size: 14px;
        background: white;
        color: #20232a;
        border: 1px solid #b8c0ca;
        border-radius: 7px;
        padding: 10px 15px;
        cursor: pointer;
      }
      button:hover {
        background: #f0f6ff;
      }
      button:focus-visible {
        outline: 3px solid #075dc0;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #progress {
        min-width: 90px;
        text-align: center;
        font-size: 14px;
      }
      #notes {
        max-width: 1000px;
        margin: 0 auto 40px;
        padding: 28px;
        background: white;
        border: 1px solid #cdd3db;
        line-height: 1.65;
      }
      #notes p {
        white-space: pre-wrap;
        font-size: 18px;
      }
      #notes h2 {
        font-size: 24px;
      }
      #notes small {
        display: block;
        overflow-wrap: anywhere;
      }
      #hint {
        text-align: center;
        font-size: 13px;
        color: #505862;
        margin: 0 0 20px;
      }
      @page {
        size: 12.5in 7.03125in;
        margin: 0;
      }
      @media print {
        body {
          background: white;
        }
        main {
          width: 1200px !important;
          height: auto !important;
          margin: 0;
        }
        .slide,
        .slide[hidden] {
          display: block;
          position: relative;
          transform: none;
          box-shadow: none;
          break-after: page;
          margin: 0;
        }
        nav,
        #notes,
        #hint {
          display: none !important;
        }
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Presentation"><!-- SLIDES --></main>
    <nav aria-label="Presentation controls">
      <button id="previous">Previous</button><span id="progress" role="status"></span
      ><button id="next">Next</button
      ><button id="toggle-notes" aria-controls="notes" aria-expanded="false">Speaker notes</button
      ><button id="fullscreen">Full screen</button><button id="print">Print / PDF</button
      ><button id="timer">Start rehearsal timer</button>
    </nav>
    <p id="hint">Left / Right: navigate · N: notes · Home / End: first / last</p>
    <aside id="notes" hidden>
      <h2 id="note-title"></h2>
      <strong id="note-time"></strong>
      <p id="note-text"></p>
      <small id="note-source"></small>
    </aside>
    <script>
      const notes = '__BRIEF_NOTES__';
      const slides = [...document.querySelectorAll('.slide')];
      let index = 0;
      function show(value) {
        index = Math.max(0, Math.min(slides.length - 1, value));
        slides.forEach((slide, i) => (slide.hidden = i !== index));
        document.querySelector('#progress').textContent = `${index + 1} / ${slides.length}`;
        document.querySelector('#previous').disabled = index === 0;
        document.querySelector('#next').disabled = index === slides.length - 1;
        document.querySelector('#note-title').textContent = notes[index].title;
        document.querySelector('#note-time').textContent = notes[index].time;
        document.querySelector('#note-text').textContent = notes[index].notes;
        document.querySelector('#note-source').textContent = `Evidence: ${notes[index].source}`;
        history.replaceState(null, '', `#${index + 1}`);
      }
      function fit() {
        const scale = Math.min((innerWidth - 32) / 1200, (innerHeight - 145) / 675, 1.3);
        document.documentElement.style.setProperty('--scale', Math.max(0.1, scale));
        const main = document.querySelector('main');
        main.style.width = `${1200 * Math.max(0.1, scale)}px`;
        main.style.height = `${675 * Math.max(0.1, scale)}px`;
      }
      function toggleNotes() {
        const aside = document.querySelector('#notes');
        aside.hidden = !aside.hidden;
        document
          .querySelector('#toggle-notes')
          .setAttribute('aria-expanded', String(!aside.hidden));
      }
      document.querySelector('#previous').onclick = () => show(index - 1);
      document.querySelector('#next').onclick = () => show(index + 1);
      document.querySelector('#toggle-notes').onclick = toggleNotes;
      document.querySelector('#print').onclick = () => window.print();
      document.querySelector('#fullscreen').onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
      };
      let started = 0;
      document.querySelector('#timer').onclick = () => {
        started = Date.now();
      };
      setInterval(() => {
        if (started) {
          const sec = Math.floor((Date.now() - started) / 1000);
          document.querySelector('#timer').textContent =
            `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')} / 15:00 · restart`;
        }
      }, 1000);
      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.metaKey || event.ctrlKey) return;
        if (['ArrowRight', 'PageDown'].includes(event.key)) {
          event.preventDefault();
          show(index + 1);
        }
        if (['ArrowLeft', 'PageUp'].includes(event.key)) {
          event.preventDefault();
          show(index - 1);
        }
        if (event.key === 'Home') {
          event.preventDefault();
          show(0);
        }
        if (event.key === 'End') {
          event.preventDefault();
          show(slides.length - 1);
        }
        if (event.key.toLowerCase() === 'n') toggleNotes();
      });
      window.addEventListener('resize', fit);
      fit();
      show(Number(location.hash.slice(1)) - 1 || 0);
    </script>
  </body>
</html>
